<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - Gestão Jurídica</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<div class="tela-login">
  <div class="cartao-login">
    <div class="marca-login" id="marca-login"></div>
    <h1>Gestão Jurídica</h1>
    <div class="subtitulo">Acesso do escritório</div>

    <div id="mensagem-erro" class="campo-erro oculto"></div>

    <div id="area-google" class="oculto">
      <button type="button" class="botao botao-google" id="botao-google">
        <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.2-.4-4.7H24v8.9h11.8c-.5 2.7-2 5.1-4.4 6.7v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.4z"/>
          <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9h-7.3v5.7C8.1 41.1 15.4 46 24 46z"/>
          <path fill="#FBBC05" d="M11.8 28.3c-.4-1.3-.7-2.7-.7-4.3s.3-2.9.7-4.3v-5.7H4.5C2.9 17.1 2 20.4 2 24s.9 6.9 2.5 10l7.3-5.7z"/>
          <path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.1 29.9 2 24 2 15.4 2 8.1 6.9 4.5 14l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/>
        </svg>
        Entrar com Google
      </button>
      <div class="separador-login"><span>ou</span></div>
    </div>

    <form id="form-login">
      <div class="campo">
        <label for="campo-login">Usuário</label>
        <input type="text" id="campo-login" autocomplete="username" required autofocus>
      </div>
      <div class="campo">
        <label for="campo-senha">Senha</label>
        <input type="password" id="campo-senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="botao botao-primario" style="width:100%; justify-content:center; margin-top:6px;">Entrar</button>
    </form>

    <div class="texto-suave texto-pequeno" style="margin-top:16px; text-align:center;">
      O acesso é criado pelo administrador do escritório — não há cadastro nesta tela.
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/icones.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
